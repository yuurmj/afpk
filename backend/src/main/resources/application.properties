spring.application.name=afpk-backend
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.jackson.deserialization.accept-float-as-int=false

# Server-only credentials. The application starts without a key, but AI requests
# return a helpful 503 error until GEMINI_API_KEY is configured.
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.connect-timeout=5s
gemini.read-timeout=45s
gemini.max-output-tokens=4096
